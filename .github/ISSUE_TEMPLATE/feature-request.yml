name: 功能建议
description: 提议新的用户能力或工程改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁遇到了什么问题，为什么现有能力不足？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察结果，不要只给出单一实现方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 已考虑的替代方法和代价。
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 说明涉及的应用、包、协议、数据、安全或部署边界，以及明确不做什么。
  - type: textarea
    id: verification
    attributes:
      label: 验证方式
      description: 如何证明功能完成且没有破坏既有边界？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue、PR、路线图和 ADR。
          required: true
        - label: 我没有在内容中加入凭据、生产数据或安全漏洞细节。
          required: true
