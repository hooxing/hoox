name: Demo 持续部署

on:
  workflow_run:
    workflows: ["持续集成"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hoox-demo-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建 ARM64 镜像并发布 Demo
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: demo
    env:
      IMAGE_NAME: ghcr.io/hooxing/hoox-demo
      HOOX_DEMO_ROOT: /opt/hoox-demo
      HOOX_DEMO_DOMAIN: hoox.aisay.cc
      HOOX_DEMO_BUCKET: agent-runtime-demo
      REMOTE_DOCKER_CONFIG: /opt/hoox-demo/shared/.docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: 验证当前提交与 CI 发布门禁
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/demo-release-gate.mjs

      - name: 初始化 Buildx
        if: steps.revision.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GHCR
        if: steps.revision.outputs.should_deploy == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEMO_GHCR_TOKEN }}

      - name: 构建并推送 Demo 镜像
        if: steps.revision.outputs.should_deploy == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.demo
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.release_id }}
          cache-from: type=gha,scope=hoox-demo-arm64
          cache-to: type=gha,mode=max,scope=hoox-demo-arm64
          provenance: true
          sbom: true

      - name: 发布前复核提交与 CI
        id: preflight
        if: steps.revision.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/demo-release-gate.mjs

      - name: 配置 SSH
        id: ssh
        if: steps.preflight.outputs.should_deploy == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/hoox-demo"
          chmod 0600 "$HOME/.ssh/hoox-demo"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          cat >"$HOME/.ssh/config" <<'EOF'
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 0600 "$HOME/.ssh/config"

      - name: 上传部署契约
        if: steps.preflight.outputs.should_deploy == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          RELEASE_ID: ${{ steps.revision.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/hoox-demo-deploy.tar.gz"
          tar -C deploy/demo -czf "$archive" \
            docker-compose.yml postgres-init.sh nginx.conf.template remote-deploy.sh
          ssh -i "$HOME/.ssh/hoox-demo" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$HOOX_DEMO_ROOT/releases/$RELEASE_ID'"
          scp -i "$HOME/.ssh/hoox-demo" "$archive" "$SSH_USER@$SSH_HOST:/tmp/hoox-demo-deploy-$RELEASE_ID.tar.gz"
          ssh -i "$HOME/.ssh/hoox-demo" "$SSH_USER@$SSH_HOST" \
            "tar -xzf '/tmp/hoox-demo-deploy-$RELEASE_ID.tar.gz' -C '$HOOX_DEMO_ROOT/releases/$RELEASE_ID' && rm -f '/tmp/hoox-demo-deploy-$RELEASE_ID.tar.gz' && chmod 0555 '$HOOX_DEMO_ROOT/releases/$RELEASE_ID/remote-deploy.sh' '$HOOX_DEMO_ROOT/releases/$RELEASE_ID/postgres-init.sh'"

      - name: 发布并验证
        if: steps.preflight.outputs.should_deploy == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER }}
          GHCR_TOKEN: ${{ secrets.DEMO_GHCR_TOKEN }}
          RELEASE_ID: ${{ steps.revision.outputs.release_id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          # 预置 auths 禁止 Docker 自动探测宿主机凭据 helper，令牌只落入本次发布目录。
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' | ssh -i "$HOME/.ssh/hoox-demo" "$SSH_USER@$SSH_HOST" \
            "umask 077; install -d -m 0700 '$REMOTE_DOCKER_CONFIG' && cat >'$REMOTE_DOCKER_CONFIG/config.json'"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/hoox-demo" "$SSH_USER@$SSH_HOST" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          ssh -i "$HOME/.ssh/hoox-demo" "$SSH_USER@$SSH_HOST" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' HOOX_DEMO_ROOT='$HOOX_DEMO_ROOT' RELEASE_ID='$RELEASE_ID' HOOX_DEMO_IMAGE='$IMAGE_NAME@$IMAGE_DIGEST' HOOX_DEMO_DOMAIN='$HOOX_DEMO_DOMAIN' HOOX_DEMO_BUCKET='$HOOX_DEMO_BUCKET' '$HOOX_DEMO_ROOT/releases/$RELEASE_ID/remote-deploy.sh'"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry-max-time 120 --retry 12 --retry-delay 5 "https://$HOOX_DEMO_DOMAIN/api/ready" >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry-max-time 120 --retry 12 --retry-delay 5 "https://$HOOX_DEMO_DOMAIN/" >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry-max-time 120 --retry 12 --retry-delay 5 "https://$HOOX_DEMO_DOMAIN/trajectory/" >/dev/null

      - name: 清理发布凭据
        if: always() && steps.ssh.outcome == 'success'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER }}
        run: |
          set -Eeuo pipefail
          trap 'rm -f "$HOME/.ssh/hoox-demo"' EXIT
          ssh -i "$HOME/.ssh/hoox-demo" "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_DOCKER_CONFIG" <<'EOF'
          set -uo pipefail
          config_dir="$1"
          status=0
          if [[ -f "$config_dir/config.json" ]]; then
            DOCKER_CONFIG="$config_dir" docker logout ghcr.io >/dev/null 2>&1 || status=$?
          fi
          rm -f "$config_dir/config.json" || { code=$?; (( status != 0 )) || status=$code; }
          if [[ -d "$config_dir" ]]; then
            rmdir "$config_dir" || { code=$?; (( status != 0 )) || status=$code; }
          fi
          exit "$status"
          EOF

  diagnose:
    name: 临时只读排队诊断
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/fix-ptc-queued-run'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    environment: demo
    steps:
      - name: 只读观测服务与队列
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$HOME/.ssh/hoox-demo"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/hoox-demo" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/hoox-demo" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          for service in worker scheduler api; do
            docker inspect --format "service=$service state={{.State.Status}} restarting={{.State.Restarting}} restarts={{.RestartCount}} started={{.State.StartedAt}}" "hoox-demo-$service-1"
          done
          for service in worker scheduler; do
            for message in '进程已启动' '进程启动失败' 'PERSISTENCE_UNAVAILABLE'; do
              count=$(docker logs --since 2h --tail 1000 "hoox-demo-$service-1" 2>&1 | grep -c "$message" || true)
              printf '%s log_category=%s count=%s\n' "$service" "$message" "$count"
            done
          done
          docker exec -i hoox-demo-postgres-1 sh -c 'exec psql -X --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='10s';
          SELECT format('SET LOCAL search_path TO %I',n.nspname) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relname='run_dispatch_outbox';
          \gexec
          SELECT 'runs' AS category,status,count(*) FROM runs GROUP BY status ORDER BY status;
          SELECT 'outbox' AS category,state,count(*),min(created_at) AS oldest,max(updated_at) AS latest,max(dispatch_attempts) AS max_attempts, sum(dispatch_attempts) AS attempts FROM run_dispatch_outbox GROUP BY state ORDER BY state;
          SELECT 'outbox_error' AS category,CASE WHEN last_error_code IN ('PERSISTENCE_UNAVAILABLE','LEASE_BUSY','RUN_TERMINAL','RUNTIME_UNAVAILABLE') THEN last_error_code WHEN last_error_code IS NULL THEN 'none' ELSE 'other' END AS code,count(*) FROM run_dispatch_outbox WHERE state IN ('ready','claimed') GROUP BY 2;
          SELECT 'assignment' AS category,state,count(*),min(next_attempt_at),max(updated_at),max(generation),count(*) FILTER(WHERE lease_expires_at<clock_timestamp()) AS expired FROM worker_tenant_assignments GROUP BY state;
          SELECT 'queued_snapshot' AS category,count(*) AS queued,count(s.run_id) AS snapshots,count(s.runtime_settings_revision) AS settings_snapshots FROM runs r LEFT JOIN run_runtime_config_snapshots s ON s.tenant_id=r.tenant_id AND s.run_id=r.id WHERE r.status='queued';
          SELECT 'mode' AS category,configuration->>'toolCallingMode' AS mode FROM admin_control_config_revisions r JOIN admin_control_active_configs a USING(object_kind,object_key,revision) WHERE object_kind='runtime_settings';
          COMMIT;
          SQL
          docker compose --project-name hoox-demo --env-file /opt/hoox-demo/shared/compose.env -f /opt/hoox-demo/current/docker-compose.yml run --rm --no-deps -T --entrypoint node worker --input-type=module <<'JS'
          import { selectWorkerProcessEnvironment, parseWorkerProcessEnvironment, probeDevelopmentWorkerDependencies, createOpenAiCompatibleModel, createOpenAiCompatibleModelContextCapability } from './runtime-ts/apps/agent-worker/dist/process-entry.js';
          import { createPostgresPool, ModelProviderCredentialCipher } from './runtime-ts/packages/persistence/dist/index.js';
          import { defaultModelConfiguration, normalizeStoredModelProviderConfiguration } from './runtime-ts/packages/admin-control/dist/index.js';
          let stage='parse';
          try {
            const config=parseWorkerProcessEnvironment(selectWorkerProcessEnvironment(process.env));
            console.log('diagnostic parse=success');
            stage='model-context';
            const {modelRuntime,model}=await createOpenAiCompatibleModel(config.model);
            await createOpenAiCompatibleModelContextCapability(modelRuntime,model);
            console.log('diagnostic model-context=success');
            const endpoint=new URL('models',config.model.baseUrl.endsWith('/')?config.model.baseUrl:config.model.baseUrl+'/');
            const response=await fetch(endpoint,{headers:{authorization:'Bearer '+config.model.apiKey},signal:AbortSignal.timeout(5000)});
            console.log(JSON.stringify({diagnostic:'deployment-model-probe',status:response.status}));
            stage='active-model';
            const pool=createPostgresPool({connectionString:config.databaseUrl,schema:config.databaseSchema,expectedRuntimeRole:config.databaseRuntimeRole,applicationName:'hoox-readonly-model-diagnostic'});
            try {
              const result=await pool.query("SELECT r.object_key,r.configuration FROM admin_control_active_configs a JOIN admin_control_config_revisions r USING(object_kind,object_key,revision) WHERE a.object_kind='model_provider'");
              if(result.rows[0]) {
                const row=result.rows[0];
                const key=row.configuration.credential?new ModelProviderCredentialCipher(config.model.credentialEncryptionKey).decrypt(row.object_key,row.configuration.credential):config.model.apiKey;
                const current=new URL('models',row.configuration.baseUrl.endsWith('/')?row.configuration.baseUrl:row.configuration.baseUrl+'/');
                const activeResponse=await fetch(current,{headers:{authorization:'Bearer '+key},signal:AbortSignal.timeout(5000)});
                let listed=false; let catalog=[]; const configuredModel=normalizeStoredModelProviderConfiguration({...row.configuration,credentialConfigured:!!row.configuration.credential}).defaultModelId;
                if(activeResponse.ok) { const body=await activeResponse.json(); listed=Array.isArray(body.data)&&body.data.some(model=>model.id===configuredModel); catalog=Array.isArray(body.data)?body.data.map(model=>model.id).filter(id=>typeof id==='string'&&/^[a-zA-Z0-9._/-]{1,100}$/.test(id)).slice(0,20):[]; }
                console.log(JSON.stringify({diagnostic:'active-model-probe',status:activeResponse.status,defaultModelListed:listed,configuredModel:/^[a-zA-Z0-9._/-]{1,100}$/.test(configuredModel)?configuredModel:'other',catalog}));
              } else console.log('diagnostic active-model=absent');
            } finally { await pool.end(); }
            stage='preflight';
            await probeDevelopmentWorkerDependencies(config);
            console.log('diagnostic preflight=success');
          } catch(error) {
            const frames=String(error.stack??'').split('\n').slice(1).map(line=>line.match(/([a-zA-Z0-9_-]+\.(?:js|mjs|ts):\d+:\d+)/)?.[1]).filter(Boolean).slice(0,8);
            console.log(JSON.stringify({stage,errorType:['Error','TypeError','EnvironmentConfigurationError'].includes(error.name)?error.name:'other',sqlstate:/^[0-9A-Z]{5}$/.test(error.code??'')?error.code:null,frames}));
          }
          JS
          REMOTE
