name: 持续集成

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 工程基线校验
    if: ${{ always() }}
    needs: [engineering-checks, pi-prompt-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 确认工程与 Pi 容器检查均成功
        env:
          ENGINEERING_RESULT: ${{ needs.engineering-checks.result }}
          PI_PROMPT_RESULT: ${{ needs.pi-prompt-gate.result }}
        # 跳过、取消和失败都不能让兼容旧名称的合并门禁显示成功。
        run: test "$ENGINEERING_RESULT" = success && test "$PI_PROMPT_RESULT" = success

  engineering-checks:
    name: 工程构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 从无工作区 dist 状态执行完整检查
        # 回归脚本清除所有 workspace 生成物；typecheck 必须按依赖拓扑自行构建，不能依赖缓存或前序任务残留。
        run: pnpm check:clean-workspace

      - name: Linux 最小容器启动门禁
        run: pnpm test:process:container

  pi-prompt-gate:
    name: Linux Pi Prompt 容器 Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: 初始化 Pi Prompt Gate Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 构建 Pi Prompt Gate 镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.pi-prompt-gate
          load: true
          tags: hoox/pi-prompt-gate:${{ github.sha }}
          cache-from: type=gha,scope=hoox-pi-prompt-gate
          cache-to: type=gha,mode=max,scope=hoox-pi-prompt-gate

      - name: Linux Pi Prompt 与能力清单容器门禁
        env:
          PI_PROMPT_GATE_IMAGE: hoox/pi-prompt-gate:${{ github.sha }}
        run: node scripts/run-pi-prompt-container-gate.mjs

  production-gates:
    name: Production 静态与容器 Gate
    if: ${{ always() }}
    needs: [production-static, production-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 确认静态检查与全部生产容器均成功
        env:
          STATIC_RESULT: ${{ needs.production-static.result }}
          CONTAINERS_RESULT: ${{ needs.production-containers.result }}
        run: test "$STATIC_RESULT" = success && test "$CONTAINERS_RESULT" = success

  production-static:
    name: Production 发布静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: Production 配置、漏洞、SBOM、许可证与发布静态 Gate
        run: pnpm config:check:production && pnpm security:audit:production && pnpm supply-chain:check && pnpm release:check

  production-containers:
    name: Production 容器（${{ matrix.role }}）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [api, scheduler, worker]
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: 初始化 Production Gate Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 构建 Production Gate 镜像
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.production-${{ matrix.role }}-gate
          load: true
          cache-from: type=gha,scope=hoox-production-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=hoox-production-${{ matrix.role }}

      - name: 验证 Production 容器边界
        env:
          PRODUCTION_GATE_IMAGE: ${{ steps.build.outputs.imageid }}
          PRODUCTION_GATE_ROLE: ${{ matrix.role }}
        run: node "scripts/production-${PRODUCTION_GATE_ROLE}-container-gate.mjs"

  process-portability:
    name: 进程骨架（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行进程生命周期与入口测试
        # 先删除全部工作区构建产物，防止专项测试被前序或缓存中的 dist 偶然托底。
        run: pnpm test:process-runtime:clean

  m4-development-blackbox:
    name: M4 开发黑盒（Linux PostgreSQL）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: agent_runtime_ci
          POSTGRES_USER: hooxing
          POSTGRES_PASSWORD: ci-placeholder-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooxing -d agent_runtime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备 M4 受限数据库角色
        env:
          M4_ALLOW_EPHEMERAL_DATABASE_PREPARE: "true"
          M4_DATABASE_ADMIN_URL: postgresql://hooxing:ci-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_RUNTIME_ROLE: m4_ci_runtime
          DATABASE_MIGRATOR_ROLE: m4_ci_migrator
          DATABASE_SKILL_PUBLISHER_ROLE: m4_ci_skill_publisher
          DATABASE_WORKER_COORDINATOR_ROLE: m4_ci_worker_coordinator
          DATABASE_TEAM_COORDINATOR_ROLE: m4_ci_team_coordinator
          DATABASE_ADMIN_CONTROL_ROLE: m4_ci_admin_control
          DATABASE_SCHEMA: m4_ci_runtime_schema
          M4_DATABASE_RUNTIME_PASSWORD: ci-runtime-placeholder-password
          M4_DATABASE_MIGRATOR_PASSWORD: ci-migrator-placeholder-password
          M4_DATABASE_SKILL_PUBLISHER_PASSWORD: ci-skill-publisher-placeholder-password
          M4_DATABASE_WORKER_COORDINATOR_PASSWORD: ci-worker-coordinator-placeholder-password
          M4_DATABASE_TEAM_COORDINATOR_PASSWORD: ci-team-coordinator-placeholder-password
          M4_DATABASE_ADMIN_CONTROL_PASSWORD: ci-admin-control-placeholder-password
        # 超级用户凭据只在本步骤创建受限角色；迁移与黑盒测试均不再使用它。
        run: pnpm --filter @hoox/persistence prepare:ci:m4

      - name: 验证 Runtime 模型与模式持久化快照
        env:
          DATABASE_BOOTSTRAP_URL: postgresql://hooxing:ci-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          MIGRATION_DATABASE_URL: postgresql://m4_ci_migrator:ci-migrator-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_URL: postgresql://m4_ci_runtime:ci-runtime-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_RUNTIME_ROLE: m4_ci_runtime
          DATABASE_MIGRATOR_ROLE: m4_ci_migrator
        # M4 套件结束会删除受限角色；快照验证先运行，随后 M4 仍从无 dist 状态启动。
        run: |
          pnpm build:m4-runtime-dependencies
          pnpm exec vitest run --config vitest.integration.config.ts tests/integration/postgres-core.integration.test.ts -t "PostgreSQL Runtime 模型与模式快照"

      - name: 运行 M4 真实 PostgreSQL 黑盒 Gate
        env:
          RUN_PG_RUN_WORKER_INTEGRATION: "true"
          M4_PREPROVISIONED_DATABASE: "true"
          M4_DATABASE_ADMIN_URL: postgresql://hooxing:ci-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_BOOTSTRAP_URL: postgresql://m4_ci_migrator:ci-migrator-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_URL: postgresql://m4_ci_runtime:ci-runtime-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_WORKER_COORDINATOR_URL: postgresql://m4_ci_worker_coordinator:ci-worker-coordinator-placeholder-password@127.0.0.1:5432/agent_runtime_ci
          DATABASE_RUNTIME_ROLE: m4_ci_runtime
          DATABASE_MIGRATOR_ROLE: m4_ci_migrator
          DATABASE_SKILL_PUBLISHER_ROLE: m4_ci_skill_publisher
          DATABASE_WORKER_COORDINATOR_ROLE: m4_ci_worker_coordinator
          DATABASE_TEAM_COORDINATOR_ROLE: m4_ci_team_coordinator
          DATABASE_ADMIN_CONTROL_ROLE: m4_ci_admin_control
          DATABASE_SCHEMA: m4_ci_runtime_schema
        # M4 独立清理运行时依赖的 dist，以此回归验证黑盒不依赖其他 Job 或缓存遗留。
        run: pnpm test:integration:m4:clean
