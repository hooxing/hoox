name: 持续集成

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 工程基线校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.15.1
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 从无 vendor dist 状态执行完整检查
        # 回归脚本先删除生成物；typecheck 必须自行构建固定版本 SDK，不能依赖前次任务残留。
        run: pnpm check:clean-vendor

      - name: Linux 最小容器启动门禁
        run: pnpm test:process:container

  process-portability:
    name: 进程骨架（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.15.1
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行进程生命周期与入口测试
        # 先删除全部工作区构建产物，防止专项测试被前序或缓存中的 dist 偶然托底。
        run: pnpm test:process-runtime:clean

  m4-development-blackbox:
    name: M4 开发黑盒（Linux PostgreSQL）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: agent_runtime_ci
          POSTGRES_USER: hooxing
          POSTGRES_PASSWORD: ci-placeholder-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooxing -d agent_runtime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.15.1
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 M4 真实 PostgreSQL 黑盒 Gate
        env:
          RUN_PG_RUN_WORKER_INTEGRATION: "true"
          DATABASE_BOOTSTRAP_URL: postgresql://hooxing:ci-placeholder-password@127.0.0.1:5432/agent_runtime_ci
        run: pnpm test:integration:m4
