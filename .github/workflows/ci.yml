name: 持续集成

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 工程基线校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 从无 vendor dist 状态执行完整检查
        # 回归脚本先删除生成物；typecheck 必须自行构建固定版本 SDK，不能依赖前次任务残留。
        run: pnpm check:clean-vendor
