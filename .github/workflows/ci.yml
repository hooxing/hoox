name: 持续集成

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 工程基线校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.15.1
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 从无 vendor dist 状态执行完整检查
        # 回归脚本先删除生成物；typecheck 必须自行构建固定版本 SDK，不能依赖前次任务残留。
        run: pnpm check:clean-vendor

      - name: Linux 最小容器启动门禁
        run: pnpm test:process:container

  process-portability:
    name: 进程骨架（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.15.1
          run_install: false

      - name: 安装 Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 冻结安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行进程生命周期与入口测试
        # 先删除全部工作区构建产物，防止专项测试被前序或缓存中的 dist 偶然托底。
        run: pnpm test:process-runtime:clean
