name: hoox-demo

x-runtime: &runtime
  image: ${HOOX_DEMO_IMAGE:?HOOX_DEMO_IMAGE is required}
  network_mode: host
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/infra.env
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${HOOX_DEMO_RELEASE_DIR:?HOOX_DEMO_RELEASE_DIR is required}/postgres-init.sh:/docker-entrypoint-initdb.d/10-hoox-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/infra.env
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["ops"]
    restart: "no"
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/infra.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set runtime http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "runtime/$${S3_BUCKET}"
        mc anonymous set none "runtime/$${S3_BUCKET}"
        mc admin user add runtime "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc admin policy attach runtime readwrite --user "$${S3_ACCESS_KEY_ID}"
        mc admin user add runtime "$${SKILL_PUBLISHER_S3_ACCESS_KEY_ID}" "$${SKILL_PUBLISHER_S3_SECRET_ACCESS_KEY}"
        mc admin policy attach runtime readwrite --user "$${SKILL_PUBLISHER_S3_ACCESS_KEY_ID}"

  migrate:
    <<: *runtime
    profiles: ["ops"]
    restart: "no"
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/migration.env
    command: ["node", "runtime-ts/packages/persistence/dist/cli.js", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/api.env
    environment:
      DEMO_ADMIN_USER_ID: ${DEMO_ADMIN_USER_ID:-user_demo_pending}
    command: ["node", "runtime-ts/apps/api/dist/development-main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    <<: *runtime
    environment:
      STATIC_LISTEN_HOST: 127.0.0.1
      STATIC_LISTEN_PORT: "4173"
    command: ["node", "scripts/demo-static-server.mjs"]

  admin-control:
    <<: *runtime
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/admin-control.env
    environment:
      DEV_ADMIN_CONTROL_USER_ID: ${DEMO_ADMIN_USER_ID:-user_demo_pending}
    command: ["node", "runtime-ts/apps/admin-control-api/dist/development-main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin-web:
    <<: *runtime
    environment:
      STATIC_ROOT: /opt/hoox/runtime-ts/apps/admin-web/dist
      STATIC_LISTEN_HOST: 127.0.0.1
      STATIC_LISTEN_PORT: "4174"
    command: ["node", "scripts/demo-static-server.mjs"]

  scheduler:
    <<: *runtime
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/scheduler.env
    environment:
      SCHEDULER_TENANT_ID: ${DEMO_TENANT_ID:-tenant_demo_pending}
    command: ["node", "runtime-ts/apps/scheduler/dist/development-main.js"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *runtime
    env_file:
      - ${HOOX_DEMO_ROOT:-/opt/hoox-demo}/shared/worker.env
    environment:
      AGENT_WORKER_TENANT_ID: ${DEMO_TENANT_ID:-tenant_demo_pending}
      DEV_AUTH_USER_A_TENANT_ID: ${DEMO_TENANT_ID:-tenant_demo_pending}
      MODEL_WIRE_TRACE_ENABLED: "true"
    command: ["node", "runtime-ts/apps/agent-worker/dist/development-main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  # 一次性测试数据 epoch 必须成对切换；旧卷保留给候选发布失败后的上一 release。
  postgres_data:
    name: hoox-demo-postgres-data-20261120
  minio_data:
    name: hoox-demo-minio-data-20261120
